appId: com.shiro.screenshare
productName: Shiro Screen Share
copyright: Copyright © 2026 Nekomura

directories:
  output: dist

files:
  - src/**/*
  - "!src/**/*.map"
  - "!src/renderer/app.js"
  - node_modules/**/*
  - "!backend/**/*"

extraResources:
  - from: icon.ico
    to: .
  - from: icon.png
    to: .

win:
  icon: icon.ico
  target:
    - target: nsis
      arch:
        - x64
  signingHashAlgorithms: []
  signAndEditExecutable: false
  artifactName: ${productName} Setup ${version}.${ext}
  fileAssociations:
    - ext: shiro
      name: Shiro Protocol
      description: Shiro Screen Share Protocol
      icon: icon.ico
  asarUnpack:
    - icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: icon.ico
  uninstallerIcon: icon.ico
  uninstallDisplayName: Shiro Screen Share
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Shiro Screen Share
  perMachine: false

publish:
  provider: github

protocols:
  - name: Shiro Screen Share
    schemes:
      - shiro

# Disable code signing for development builds
afterSign: null
